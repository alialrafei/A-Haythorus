<svg xmlns="http://www.w3.org/2000/svg" width="1504" height="1004" viewBox="0 0 1504 1004" role="img" aria-labelledby="title desc">
<title id="title">A-Haythorus Infrastructure Architecture — animated</title><desc id="desc">Animated architecture diagram showing JVM and Linux telemetry entering the sidecar, Kubernetes discovery, and peer HTTP.</desc>
<rect width="1504" height="1004" fill="#08101f"/><text x="52" y="70" fill="#f4f7ff" font-family="Arial,sans-serif" font-size="34" font-weight="700">A-Haythorus — Infrastructure Architecture</text><text x="52" y="105" fill="#9fb1cc" font-family="Arial,sans-serif" font-size="18">Lightweight runtime observability • JVM diagnosis today • peer-aware Kubernetes monitoring</text>
<rect x="38" y="150" width="1428" height="700" rx="16" fill="#101d31" stroke="#314867" stroke-width="2"/><text x="60" y="184" fill="#9fb1cc" font-family="Arial,sans-serif" font-size="16" font-weight="700">KUBERNETES NAMESPACE</text>
