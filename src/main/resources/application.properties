app.name=side-car

logfile=false
runtime.mode=local

server.host=0.0.0.0
server.port=8899

sidecar.peers=
sidecar.discovery.label=a-haythorus.io/enabled=true

# Base JVM telemetry sampling interval.
collector.interval.ms=10000

# Hard memory bound for retained lightweight samples per JVM.
history.max.samples=120

# Leak analysis uses samples whose timestamps fall within this recent time window.
leak.window.seconds=60

# EWMA weight assigned to the newest leak evidence. Must be in (0, 1].
leak.ewma.alpha=0.35

cluster.connect.timeout.ms=1000
cluster.request.timeout.ms=2000

# Weights for the various leak evidence signals. Must be in [0, 1].
analysis.memory.heap-persistence.max-points=10
analysis.memory.heap-growth.max-points=10
analysis.memory.old-gen-persistence.max-points=10
analysis.memory.old-gen-growth.max-points=10
analysis.memory.gc-retention.max-points=10
analysis.memory.histogram-growth.max-points=10
analysis.cpu.top-threads=10