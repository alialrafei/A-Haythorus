app.name=side-car

logfile=false
runtime.mode=local

server.host=0.0.0.0
server.port=8899

sidecar.peers=
sidecar.discovery.label=a-haythorus.io/enabled=true

collector.interval.ms=10000
history.max.samples=180

# Shared recent-history horizon for runtime-neutral CPU/I/O analysis.
analysis.window.seconds=60

# JVM memory-retention analysis.
# Five minutes gives the analyzer enough GC cycles to distinguish sustained retention
# from normal short-lived heap growth during warm-up or bursty allocation.
leak.window.seconds=300
leak.ewma.alpha=0.25

# Relative importance of normalized memory evidence. Equal weights are the default.
analysis.memory.heap-retention.weight=1.0
analysis.memory.old-gen-retention.weight=1.0
analysis.memory.gc-reclaim.weight=1.0
analysis.memory.histogram-growth.weight=1.0

# Runtime-neutral CPU evidence weights.
analysis.cpu.utilization.weight=1.0
analysis.cpu.persistence.weight=1.0

# Runtime-neutral I/O evidence weights.
analysis.io.storage-activity.weight=1.0
analysis.io.syscall-activity.weight=1.0

# Number of JVM thread CPU consumers kept in the pairwise CPU detail.
analysis.cpu.top-threads=10

cluster.connect.timeout.ms=1000
cluster.request.timeout.ms=2000
cluster.max.concurrent.requests=8

# Optional Kubernetes peer sharding. Disabled by default for backward compatibility.
cluster.sharding.enabled=false
cluster.shard.count=1
cluster.shard.algorithm=sha256-modulo
cluster.shard.key-fields=namespace,pod
cluster.shard.override-label=a-haythorus.io/shard
cluster.shard.missing-key-policy=fallback
