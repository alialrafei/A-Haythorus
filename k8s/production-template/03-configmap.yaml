apiVersion: v1
kind: ConfigMap
metadata:
  name: ${AH_CLUSTER_CONFIG_NAME}
  namespace: ${NAMESPACE}
data:
  # Shard replicas by stable application identity, not Pod name.
  # Recommended value: namespace,label:app.kubernetes.io/name
  AH_CLUSTER_SHARDING_ENABLED: "${SHARDING_ENABLED}"
  AH_CLUSTER_SHARD_COUNT: "${SHARD_COUNT}"
  AH_CLUSTER_SHARD_ALGORITHM: "${SHARD_ALGORITHM}"
  AH_CLUSTER_SHARD_KEY_FIELDS: "${SHARD_KEY_FIELDS}"
  AH_CLUSTER_SHARD_OVERRIDE_LABEL: "${SHARD_LABEL}"
  AH_CLUSTER_SHARD_MISSING_KEY_POLICY: "${SHARD_MISSING_KEY_POLICY}"
  AH_CLUSTER_MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS}"
  AH_CLUSTER_CONNECT_TIMEOUT_MS: "${CONNECT_TIMEOUT_MS}"
  AH_CLUSTER_REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS}"
