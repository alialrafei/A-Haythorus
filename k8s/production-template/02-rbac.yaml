apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${AH_ROLE_NAME}
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      # Required by the current self-managed shard-label materialization.
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${AH_ROLE_BINDING_NAME}
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: ${AH_SERVICE_ACCOUNT}
    namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: ${AH_ROLE_NAME}
  apiGroup: rbac.authorization.k8s.io
